# Local development overrides.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Publishes Postgres to the host so you can run `cargo run` / `sqlx` / psql
# directly against the containerised database.

services:
  postgres:
    ports:
      - "5432:5432"

  loontail-launcher-api:
    environment:
      RUST_LOG: "debug,sqlx=info,tower_http=debug"
