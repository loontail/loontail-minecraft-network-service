name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the rustc inside the release image (Dockerfile `FROM rust:...`),
  # otherwise fmt/clippy pass here and fail during the image build. The
  # "Assert toolchain" step below fails the run if the two drift apart.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  backend:
    name: backend (fmt / clippy / build / test)
    runs-on: ubuntu-latest

    services:
      postgres:
        # postgres:16
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: loontail
          POSTGRES_PASSWORD: loontail
          POSTGRES_DB: loontail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loontail -d loontail_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # sqlx is runtime-only; the DB is needed for `cargo test` (#[sqlx::test]).
      DATABASE_URL: postgres://loontail:loontail@localhost:5432/loontail_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert toolchain matches the release image
        run: |
          set -euo pipefail
          tag_version="$(grep -oE '^FROM rust:[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)"
          case "$RUST_TOOLCHAIN" in
            "$tag_version" | "$tag_version".*) ;;
            *)
              echo "::error::Dockerfile builds on rust:${tag_version} but CI uses ${RUST_TOOLCHAIN}. Update both."
              exit 1
              ;;
          esac

      - name: Install Rust toolchain
        # branch 1.95.0 (dtolnay/rust-toolchain publishes branches, not tags).
        # Pinning to a SHA makes `github.action_ref` a SHA, so `toolchain:` must
        # be passed explicitly — the action has no rust-toolchain.toml fallback.
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

  admin-ui:
    name: admin-ui (build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (multi-stage, embeds the admin SPA)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: loontail-launcher-api:ci
          # scope=ci keeps this cache disjoint from the production build's
          # scope=deploy, so a poisoned CI layer can never be reused by a
          # release build (and vice versa).
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
