name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (fmt / clippy / build / test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loontail
          POSTGRES_PASSWORD: loontail
          POSTGRES_DB: loontail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loontail -d loontail_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # sqlx is runtime-only; the DB is needed for `cargo test` (#[sqlx::test]).
      DATABASE_URL: postgres://loontail:loontail@localhost:5432/loontail_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  admin-ui:
    name: admin-ui (build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (multi-stage, embeds the admin SPA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: loontail-launcher-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
