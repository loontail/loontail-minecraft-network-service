[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/yggdrasil-protocol",
    "crates/network",
    "crates/yggdrasil",
    "crates/textures",
    "crates/catalog",
    "crates/bundles",
    "crates/admin",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
rand = "0.10"
hex = "0.4"
subtle = "2"
dotenvy = "0.15"
futures-util = "0.3"
sha1 = "0.11"
argon2 = "0.6"
rsa = { version = "0.9", features = ["sha1", "sha2", "getrandom"] }
base64 = "0.23"
zip = "8"
rust-embed = "8"
mime_guess = "2"
form_urlencoded = "1"

# Internal crates
loontail-core = { path = "crates/core" }
loontail-yggdrasil-protocol = { path = "crates/yggdrasil-protocol" }
loontail-network = { path = "crates/network" }
loontail-yggdrasil = { path = "crates/yggdrasil" }
loontail-textures = { path = "crates/textures" }
loontail-catalog = { path = "crates/catalog" }
loontail-bundles = { path = "crates/bundles" }
loontail-admin = { path = "crates/admin" }

[profile.release]
opt-level = 3
lto = "thin"
