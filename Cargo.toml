[package]
name = "loontail-minecraft-network-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Loontail Minecraft Network Service — backend for users, friends, presence, world sessions, join flow and relay/tunnel"
license = "MIT"

[[bin]]
name = "loontail-minecraft-network-service"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
dotenvy = "0.15"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
