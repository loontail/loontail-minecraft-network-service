# loontail-launcher-api — production compose (Hetzner).
#
# Unlike docker-compose.yml (which BUILDS the service locally), this file PULLS
# a prebuilt image from GHCR. The image ref is injected by the deploy workflow
# as LOONTAIL_IMAGE (a pinned ghcr.io/<owner>/<repo>:sha-<commit> tag).
#
# Secrets and tunables live in .env.prod on the server (written by the deploy
# workflow). Required keys: POSTGRES_PASSWORD, DATABASE_URL, NETWORK_DOMAIN.
#
# Usage on the server (the deploy workflow does this for you):
#   LOONTAIL_IMAGE=ghcr.io/<owner>/<repo>:sha-<commit> \
#     docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

name: loontail-launcher-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: loontail-launcher-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loontail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-loontail_launcher}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loontail} -d ${POSTGRES_DB:-loontail_launcher}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loontail-launcher-api:
    image: ${LOONTAIL_IMAGE:?LOONTAIL_IMAGE is required (set by the deploy workflow)}
    container_name: loontail-launcher-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in .env.prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # why: Caddy terminates TLS in front of this container, so without it every
      # request carries Caddy's IP and the per-IP credential limiter below degrades
      # into one global bucket that any single attacker can exhaust for everyone.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-60}
      MAX_PLAYERS_PER_WORLD: ${MAX_PLAYERS_PER_WORLD:-5}
      JOIN_REQUEST_TTL_SECONDS: ${JOIN_REQUEST_TTL_SECONDS:-60}
      JOIN_TICKET_TTL_SECONDS: ${JOIN_TICKET_TTL_SECONDS:-60}
      INVITE_TTL_SECONDS: ${INVITE_TTL_SECONDS:-600}
      SEARCH_MIN_QUERY_LENGTH: ${SEARCH_MIN_QUERY_LENGTH:-2}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-20}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      REQUEST_LOG_RETENTION_DAYS: ${REQUEST_LOG_RETENTION_DAYS:-7}
      # Retention (days) for terminal join requests/invites, spent join tickets and
      # user_events; pruned by the hourly cleanup tick.
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      YGGDRASIL_PUBLIC_URL: ${YGGDRASIL_PUBLIC_URL:-/api/yggdrasil}
      YGGDRASIL_KEY_PATH: ${YGGDRASIL_KEY_PATH:-data/yggdrasil/keys/active.key.pem}
      YGGDRASIL_TOKEN_TTL_SECONDS: ${YGGDRASIL_TOKEN_TTL_SECONDS:-1296000}
      YGGDRASIL_MAX_TOKENS_PER_USER: ${YGGDRASIL_MAX_TOKENS_PER_USER:-10}
      YGGDRASIL_SKIN_DOMAINS: ${YGGDRASIL_SKIN_DOMAINS:-.loontail.dev,localhost}
      TEXTURES_STORAGE_ROOT: ${TEXTURES_STORAGE_ROOT:-data/textures}
      CATALOG_MEDIA_STORAGE_ROOT: ${CATALOG_MEDIA_STORAGE_ROOT:-data/catalog-media}
      BUNDLES_STORAGE_ROOT: ${BUNDLES_STORAGE_ROOT:-data/bundle-registry}
      BUNDLES_PUBLIC_URL: ${BUNDLES_PUBLIC_URL:-/bundle-registry}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-604800}
      ADMIN_COOKIE_NAME: ${ADMIN_COOKIE_NAME:-loontail_admin}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      RUST_LOG: ${RUST_LOG:-info,loontail_launcher_api=info,loontail_network=info,sqlx=warn}
    volumes:
      # Persist Yggdrasil keys, textures and bundle-registry files across restarts.
      - app_data:/app/data
    ports:
      # Direct (non-TLS) access / fallback. Caddy fronts the public 80+443 and
      # proxies to this container over the compose network, so this published
      # port is only for debugging or talking to the service without TLS.
      - "${HTTP_PORT:-8080}:8080"

  # TLS-terminating reverse proxy: serves https://$NETWORK_DOMAIN on 80/443 and
  # forwards to the service (WebSocket relay/signaling included). Certificates
  # are obtained automatically from Let's Encrypt and persisted in caddy_data.
  caddy:
    image: caddy:2-alpine
    container_name: loontail-launcher-api-caddy
    restart: unless-stopped
    depends_on:
      - loontail-launcher-api
    environment:
      NETWORK_DOMAIN: ${NETWORK_DOMAIN:?NETWORK_DOMAIN is required in .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
